<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#C3CFDA">
<title>说话宠物</title>
<style>
:root{
  --wall1:#E3E9EF; --wall2:#C3CFDA; --floor1:#B4C1CD; --floor2:#9DAAB7;
  --ink:#33404D; --title:rgba(46,62,80,.78);
  --btn:#FFFFFF; --btnInk:#3B4855;
  --barTop:rgba(255,255,255,.74); --barBot:rgba(236,242,247,.95);
  --barLine:rgba(255,255,255,.9); --barShadow:rgba(48,66,86,.14);
  --chipBg:rgba(255,255,255,.72); --chipLine:rgba(255,255,255,.9);
  --accent:#4A90D9; --rec:#E8453C;
  --page:#C3CFDA;
}
body.night{
  --wall1:#232E3C; --wall2:#141C26; --floor1:#2A3644; --floor2:#1A232E;
  --ink:#DCE6F0; --title:rgba(214,228,242,.86);
  --btn:#2B3A4A; --btnInk:#D3E1EF;
  --barTop:rgba(30,41,54,.80); --barBot:rgba(16,23,31,.96);
  --barLine:rgba(255,255,255,.09); --barShadow:rgba(0,0,0,.5);
  --chipBg:rgba(43,58,74,.78); --chipLine:rgba(255,255,255,.10);
  --page:#141C26;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--page);color:var(--ink);
  user-select:none;-webkit-user-select:none;
  transition:background .3s ease;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- 房间 ---------- */
#stage{
  position:relative;flex:1;min-height:0;
  background:radial-gradient(120% 90% at 50% 12%, var(--wall1) 0%, var(--wall1) 30%, var(--wall2) 68%, var(--wall2) 100%);
  overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;
  transition:background .3s ease;
}
#floor{
  position:absolute;left:-20%;right:-20%;bottom:0;height:26%;
  background:linear-gradient(180deg,var(--floor1) 0%,var(--floor2) 100%);
  transform:perspective(560px) rotateX(58deg);
  transform-origin:50% 0%;
  box-shadow:inset 0 22px 40px -14px rgba(20,30,42,.4);
  transition:background .3s ease;
}
#skirting{
  position:absolute;left:0;right:0;bottom:26%;height:14px;
  background:linear-gradient(180deg,var(--wall1),var(--floor1));
  opacity:.85;
  box-shadow:0 3px 7px rgba(30,44,58,.28);
  transition:background .3s ease;
}
#vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 85% at 50% 45%,transparent 45%,rgba(34,50,68,.28) 100%);
}

/* ---------- 角色 ---------- */
#pet{
  position:relative;z-index:2;flex:1 1 auto;min-width:0;
  width:100%;height:90%;max-height:calc(100% - 4px);
  transition:opacity .2s ease;
}
#pet svg{
  width:100%;height:100%;display:block;overflow:visible;
  filter:drop-shadow(0 18px 26px rgba(40,58,78,.22));
}
#pet.gone{opacity:0}

/* 呼吸 / 待机 / 尾巴 —— 几何原点由每个皮肤自带 */
#bodyGroup{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.016,1.009)}}
#headBob{animation:headBob 4.1s ease-in-out infinite}
@keyframes headBob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-9px) rotate(.7deg)}}
#tailGroup{animation:tailSway 2.9s ease-in-out infinite}
@keyframes tailSway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
#eyeL,#eyeR{transition:transform .075s ease}
#pupilL,#pupilR{transition:transform .22s ease-out}

/* ---------- 反应动画 ---------- */
#pet.react-pet #headGroup{animation:reactPet 1.05s ease}
@keyframes reactPet{
  0%,100%{transform:translateY(0) rotate(0)}
  22%{transform:translateY(13px) rotate(-3.5deg)}
  48%{transform:translateY(9px) rotate(-2deg)}
  72%{transform:translateY(11px) rotate(-2.6deg)}
}
#pet.react-belly #bodyGroup{animation:reactBelly .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes reactBelly{
  0%,100%{transform:scale(1)}
  28%{transform:scale(1.07,.9) translateY(14px)}
  62%{transform:scale(.97,1.05) translateY(-6px)}
}
#pet.react-tail #tailGroup{animation:reactTail .85s ease}
@keyframes reactTail{
  0%,100%{transform:rotate(-6deg)}
  15%{transform:rotate(30deg) scaleY(1.2)}
  35%{transform:rotate(-24deg)}
  55%{transform:rotate(18deg)}
  78%{transform:rotate(-10deg)}
}
#pet.react-tail #headGroup{animation:reactTurn .85s ease}
@keyframes reactTurn{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(9deg) translateY(4px)}
  60%{transform:rotate(-6deg)}
}
#pet.react-eat #headGroup{animation:reactEat .5s ease-in-out 3}
@keyframes reactEat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(12px) scale(1.02)}
}
#pet.react-happy #headGroup{animation:reactHappy .62s ease-in-out 2}
@keyframes reactHappy{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-14px) rotate(-2.5deg)}
}
#pet.speaking #headGroup{animation:speakNod .42s ease-in-out infinite}
@keyframes speakNod{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(6px) rotate(1.2deg)}
}
#pet.react-shock #headGroup{animation:reactShock .5s ease}
@keyframes reactShock{
  0%{transform:translateY(0) scale(1)}
  30%{transform:translateY(-16px) scale(1.045)}
  60%{transform:translateY(4px) scale(.99)}
  100%{transform:translateY(0) scale(1)}
}
#props{pointer-events:none}

/* ---------- 写实皮肤：整图当场景 ---------- */
#scene{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:0;pointer-events:none;opacity:0;transition:opacity .45s ease;
}
#stage.sceneon #scene{opacity:1}
#sceneIn{
  position:relative;width:100%;height:100%;overflow:hidden;
  background-repeat:no-repeat;background-size:100% 100%;background-position:center;
  transform-origin:50% 72%;
}
#floor,#skirting{transition:opacity .35s ease}
#stage.sceneon #floor,#stage.sceneon #skirting{opacity:0}

/* 说话声波（贴在标定好的嘴部坐标上） */
#pulse{position:absolute;width:0;height:0;opacity:0;transition:opacity .22s ease}
#pulse.on{opacity:1}
#pulse .glow{
  position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.92) 0%,rgba(170,225,255,.55) 34%,rgba(130,195,255,.18) 58%,rgba(130,195,255,0) 74%);
  transform:scale(calc(.30 + var(--lv,0)*1.10));
}
#pulse .rg{
  position:absolute;left:50%;top:50%;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.85);
  box-shadow:0 0 14px rgba(160,220,255,.8),inset 0 0 14px rgba(160,220,255,.55);
  animation:pripple 1.15s ease-out infinite;
}
#pulse .rg:nth-of-type(3){animation-delay:.38s}
#pulse .rg:nth-of-type(4){animation-delay:.76s}
@keyframes pripple{0%{transform:scale(.42);opacity:.85}100%{transform:scale(2.05);opacity:0}}
#pulse.hot .glow{background:radial-gradient(circle,rgba(255,238,186,.95) 0%,rgba(255,152,80,.6) 34%,rgba(255,92,50,.2) 58%,rgba(255,92,50,0) 74%)}
#pulse.hot .rg{border-color:rgba(255,196,126,.92);box-shadow:0 0 14px rgba(255,140,70,.85),inset 0 0 14px rgba(255,140,70,.5)}

/* ── 写实皮肤：嘴部换帧 ──────────────────────────────────────
   底图是「闭嘴」那一帧，这一层是「张嘴」那一帧，只在嘴部椭圆内显示，
   羽化很宽（40%→100%）所以边界看不出来，靠 --lv（说话音量）淡入淡出。 */
#mouthPatch{
  position:absolute;left:0;top:0;width:100%;height:100%;
  background-repeat:no-repeat;background-size:100% 100%;background-position:center;
  opacity:var(--lv,0);pointer-events:none;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-image:radial-gradient(ellipse var(--mrx,12%) var(--mry,10%) at var(--mcx,50%) var(--mcy,50%),#000 0 40%,rgba(0,0,0,0) 100%);
          mask-image:radial-gradient(ellipse var(--mrx,12%) var(--mry,10%) at var(--mcx,50%) var(--mcy,50%),#000 0 40%,rgba(0,0,0,0) 100%);
}

/* ── 写实皮肤：点击反应换表情 ────────────────────────────────
   每个角色三张表情帧（开心/惊讶/发火）。这些图在打包前先裁成「脸部小块」，
   块的大小 = 脸部椭圆外接框再每边外扩 56%（和 _cut.py 的 PAD=0.28 对齐），
   所以蒙版直接用 closest-side 椭圆就正好是脸，内容一定落在实心区里，
   剩下的 42% 全是羽化带，边界看不出来。 */
#exprPatch{
  position:absolute;display:none;pointer-events:none;
  background-repeat:no-repeat;background-size:100% 100%;background-position:center;
  opacity:0;transition:opacity .15s linear;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-image:radial-gradient(ellipse closest-side at 50% 50%,#000 0 58%,rgba(0,0,0,0) 100%);
          mask-image:radial-gradient(ellipse closest-side at 50% 50%,#000 0 58%,rgba(0,0,0,0) 100%);
}
#exprPatch.on{opacity:1}

/* ── 写实场景的待机呼吸：极缓慢起伏 + 轻微漂移，别像一张静止照片 ── */
#stage.sceneon #scene{animation:rbIdle 5.6s ease-in-out infinite}
@keyframes rbIdle{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%    {transform:translate(-50%,-50%) scale(1.016)}
}
#stage.sceneon #sceneIn{animation:rbDrift 13s ease-in-out infinite}
@keyframes rbDrift{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  33%    {transform:translate(2px,-5px) rotate(.22deg)}
  66%    {transform:translate(-2px,-3px) rotate(-.18deg)}
}

/* 场景反应 */
#scene.rb-bounce #sceneIn{animation:rbBounce 1.4s cubic-bezier(.3,1.4,.5,1)}
@keyframes rbBounce{
  0%,100%{transform:scale(1)}
  18%{transform:scale(1.035,.972) translateY(10px)}
  46%{transform:scale(.992,1.028) translateY(-14px)}
  74%{transform:scale(1.012,.994) translateY(4px)}
}
#scene.rb-shake #sceneIn{animation:rbShake .62s ease-in-out 3}
@keyframes rbShake{
  0%,100%{transform:translate(0,0) rotate(0)}
  20%{transform:translate(-11px,4px) rotate(-.9deg)}
  40%{transform:translate(9px,-5px) rotate(.8deg)}
  60%{transform:translate(-7px,3px) rotate(-.6deg)}
  80%{transform:translate(6px,-2px) rotate(.4deg)}
}
#scene.rb-sway #sceneIn{animation:rbSway 1.9s ease-in-out}
@keyframes rbSway{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-1.2deg) translateY(-7px)}
  55%{transform:rotate(1deg) translateY(-3px)}
  80%{transform:rotate(-.5deg)}
}
#scene.rb-pop #sceneIn{animation:rbPop .55s ease}
@keyframes rbPop{0%{transform:scale(1)}35%{transform:scale(1.045)}100%{transform:scale(1)}}

/* 皮肤条上的写实缩略图 */
.skin .th{
  width:27px;height:27px;border-radius:50%;display:block;flex:0 0 auto;
  background-repeat:no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
}
.sdiv{flex:0 0 auto;width:1px;align-self:stretch;margin:7px 2px;background:rgba(120,140,160,.32);border-radius:1px}
body.night .sdiv{background:rgba(255,255,255,.16)}

/* ---------- 底部面板 ---------- */
#bottom{
  position:relative;z-index:5;
  background:linear-gradient(180deg,var(--barTop),var(--barBot));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--barLine);
  box-shadow:0 -10px 26px var(--barShadow);
  padding-bottom:env(safe-area-inset-bottom,0px);
  transition:background .3s ease;
}
#skinbar{
  display:flex;gap:8px;padding:9px 12px 2px;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
}
#skinbar::-webkit-scrollbar{display:none}
.skin{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;
  padding:6px 13px 6px 7px;border-radius:999px;border:1.5px solid transparent;
  background:var(--chipBg);color:var(--btnInk);cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:.2px;
  transition:transform .14s ease,border-color .18s,background .18s,box-shadow .18s;
  box-shadow:0 2px 6px rgba(47,68,88,.12);
}
.skin svg{width:27px;height:27px;display:block;border-radius:50%}
.skin:active{transform:scale(.94)}
.skin.on{
  border-color:var(--accent);
  background:#fff;
  box-shadow:0 3px 12px rgba(74,144,217,.32);
}
body.night .skin.on{background:#33465A;box-shadow:0 3px 12px rgba(74,144,217,.35)}

#toolbar{
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:6px 16px 14px;
}
.tool{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  width:80px;padding:9px 4px 7px;border:none;border-radius:20px;
  background:var(--btn);color:var(--btnInk);
  box-shadow:0 3px 9px rgba(48,66,86,.15),inset 0 -2px 0 rgba(48,66,86,.06);
  cursor:pointer;transition:transform .13s ease,box-shadow .13s ease;
  font-size:12.5px;font-weight:600;letter-spacing:.2px;
  font-family:inherit;
}
.tool:active{transform:scale(.93);box-shadow:0 1px 4px rgba(48,66,86,.18)}
.tool svg{width:27px;height:27px;display:block}
.tool.on{background:linear-gradient(180deg,#FFF1F0,#FDDCD9);color:#C8352C}
body.night .tool.on{background:linear-gradient(180deg,#4A2A28,#3A1F1E);color:#FF8A80}

#micBtn{
  width:104px;height:104px;border-radius:50%;padding:0;
  margin-top:-30px;border:none;cursor:pointer;
  background:radial-gradient(circle at 36% 30%,#6FB2EE,#3D84CE 62%,#2C6BB0);
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 18px rgba(45,110,180,.42),inset 0 -4px 0 rgba(0,0,0,.14),inset 0 3px 0 rgba(255,255,255,.28);
  transition:width .26s ease,height .26s ease,margin-top .26s ease,opacity .26s ease,
             transform .13s ease,background .2s ease,box-shadow .2s ease;
  position:relative;flex:0 0 auto;
}
#micBtn svg{width:44px;height:44px}
#micBtn:active{transform:scale(.94)}
#micBtn.rec{
  background:radial-gradient(circle at 36% 30%,#F2716A,#DE3B32 62%,#B92A22);
  box-shadow:0 8px 18px rgba(200,50,40,.45),inset 0 -4px 0 rgba(0,0,0,.16),inset 0 3px 0 rgba(255,255,255,.26);
}
#micBtn.rec::before,#micBtn.rec::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:3px solid rgba(222,59,50,.55);animation:ripple 1.5s ease-out infinite;
}
#micBtn.rec::after{animation-delay:.75s}
@keyframes ripple{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.62);opacity:0}}
/* 常听模式下，中间这颗话筒不再是主按钮——说话自动触发，只在「手动插一句」时才用得上。
   所以把它收成一颗低调的小圆点，不再抢视觉；常听在跑的信号由右上角那颗绿点表示。 */
#micBtn.live:not(.rec){
  width:58px;height:58px;margin-top:0;opacity:.6;
  background:rgba(255,255,255,.5);color:#5C7A98;
  box-shadow:0 2px 9px rgba(48,66,86,.15),inset 0 0 0 1px rgba(255,255,255,.55);
}
#micBtn.live:not(.rec) svg{width:23px;height:23px}
#micBtn.live:not(.rec):active{opacity:1;transform:scale(.92)}
body.night #micBtn.live:not(.rec){
  background:rgba(255,255,255,.11);color:#9CB4CB;
  box-shadow:0 2px 9px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.10);
}
#micBtn.live:not(.rec)::after{
  content:"";position:absolute;top:2px;right:2px;inset:auto;
  width:9px;height:9px;border-radius:50%;border:none;
  background:#3ED07A;animation:pulse 1.7s ease-out infinite;
}

/* ---------- 顶部 ---------- */
#topbar{
  position:absolute;top:0;left:0;right:0;z-index:6;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  pointer-events:none;
}
#title{
  font-size:15px;font-weight:700;letter-spacing:.4px;color:var(--title);
  text-shadow:0 1px 0 rgba(255,255,255,.35);pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#acts{display:flex;gap:9px;flex:0 0 auto}
.iconbtn{
  pointer-events:auto;position:relative;
  width:42px;height:42px;border-radius:14px;border:none;cursor:pointer;
  background:var(--chipBg);color:var(--btnInk);
  box-shadow:0 3px 9px rgba(48,66,86,.16);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .13s ease,background .15s,color .15s;
}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:21px;height:21px}
.iconbtn.off{color:#A9B4C0}
#alwaysBtn.on{background:linear-gradient(180deg,#DFF3FF,#BEE6FF);color:#1D6FA8}
body.night #alwaysBtn.on{background:linear-gradient(180deg,#1E3E55,#16334A);color:#7FD3FF}
#alwaysBtn.on::after{
  content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;
  background:#3ED07A;box-shadow:0 0 0 0 rgba(62,208,122,.7);animation:pulse 1.7s ease-out infinite;
}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,208,122,.7)}100%{box-shadow:0 0 0 9px rgba(62,208,122,0)}}

#meter{
  position:absolute;left:0;top:0;height:3px;width:0;z-index:9;
  background:linear-gradient(90deg,#5AC8FA,#4A90D9);
  transition:width .07s linear;pointer-events:none;
}

/* ---------- 提示 / Toast ---------- */
#hint{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  background:rgba(30,42,56,.86);color:#fff;font-size:13.5px;font-weight:600;
  padding:9px 18px;border-radius:999px;white-space:nowrap;
  opacity:0;transition:opacity .28s ease;pointer-events:none;max-width:92vw;
  overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 6px 18px rgba(20,32,44,.34);z-index:7;
}
#hint.show{opacity:1}
#toast{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);
  background:rgba(30,42,56,.94);color:#fff;font-size:14px;line-height:1.6;
  padding:16px 22px;border-radius:18px;max-width:min(430px,82vw);text-align:center;
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;
  z-index:99;box-shadow:0 14px 40px rgba(14,26,38,.42);font-weight:500;
}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast b{color:#7FD3FF}

@media (max-width:520px){
  .tool{width:66px;font-size:11px;border-radius:17px}
  .tool svg{width:23px;height:23px}
  #micBtn{width:88px;height:88px;margin-top:-26px}
  #micBtn svg{width:38px;height:38px}
  #toolbar{gap:10px}
  #title{font-size:13.5px}
  .iconbtn{width:38px;height:38px;border-radius:13px}
  .iconbtn svg{width:19px;height:19px}
  .skin{font-size:11.5px;padding:5px 11px 5px 6px}
  .skin svg{width:24px;height:24px}
}
@media (max-height:560px){
  #pet{height:82%}
  #micBtn{width:76px;height:76px;margin-top:-22px}
  #micBtn svg{width:33px;height:33px}
  .tool{padding:6px 4px 5px}
  .tool svg{width:21px;height:21px}
  .skinbar{padding-top:6px}
}
</style>
</head>
<body>
<div id="app">

  <div id="stage">
    <div id="scene"><div id="sceneIn">
      <div id="mouthPatch"></div>
      <div id="exprPatch"></div>
      <div id="pulse">
        <span class="glow"></span><span class="rg"></span><span class="rg"></span><span class="rg"></span>
      </div>
    </div></div>
    <div id="floor"></div>
    <div id="skirting"></div>
    <div id="vignette"></div>
    <div id="meter"></div>

    <div id="pet"></div>

    <div id="topbar">
      <div id="title">说话宠物</div>
      <div id="acts">
        <button class="iconbtn" id="alwaysBtn" title="常听模式：说一句跟一句">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6 9H2v6h4l5 4V5z"/>

function ensureAudio(){

    ac = new AC();
  }
  if(ac.state === 'suspended'){ try{ ac.resume(); }catch(e){} }
  return ac;
}

var IRCACHE = {};
function getIR(dur, decay){
  var k = dur + '/' + decay;
  if(IRCACHE[k]) return IRCACHE[k];
  var rate = ac.sampleRate, len = Math.max(1, Math.floor(rate*dur));
  var buf = ac.createBuffer(2, len, rate);
  for(var c=0;c<2;c++){
    var d = buf.getChannelData(c);
    for(var i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
  }
  IRCACHE[k] = buf;
  return buf;
}

/* ---- 角色叫声 ---- */
function cry(mult, durScale, volScale){
  if(!sfxOn) return;
  ensureAudio(); if(!ac) return;
  var c = SK.cry;
  var base = mult || 1;
  var dur  = c.dur * (durScale || 1);
  var t0   = ac.currentTime + 0.01;

  var osc = ac.createOscillator(), osc2 = ac.createOscillator();
  var lp = ac.createBiquadFilter(), bp = ac.createBiquadFilter(), g = ac.createGain();
  osc.type = c.w; osc2.type = 'triangle';

  var F = c.f.map(function(v){ return v*base; });
  osc.frequency.setValueAtTime(F[0], t0);
  osc.frequency.exponentialRampToValueAtTime(F[1], t0 + dur*0.18);
  osc.frequency.exponentialRampToValueAtTime(F[2], t0 + dur*0.55);
  osc.frequency.exponentialRampToValueAtTime(F[3], t0 + dur*0.98);
  osc2.frequency.setValueAtTime(F[0]*2, t0);
  osc2.frequency.exponentialRampToValueAtTime(F[1]*2, t0 + dur*0.18);
  osc2.frequency.exponentialRampToValueAtTime(F[3]*2, t0 + dur*0.98);

  var lfo = ac.createOscillator(), lfoG = ac.createGain();
  lfo.frequency.value = c.vib[0]; lfoG.gain.value = c.vib[1]*base;
  lfo.connect(lfoG); lfoG.connect(osc.frequency);

  lp.type = 'lowpass'; lp.Q.value = c.q;
  lp.frequency.setValueAtTime(c.lp[0], t0);
  lp.frequency.exponentialRampToValueAtTime(c.lp[1], t0 + dur);
  bp.type = 'bandpass'; bp.Q.value = 1.6;
  bp.frequency.value = c.lp[0] * 0.55 + 300;

  var vol = c.vol * (volScale || 1);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.045);
  g.gain.setValueAtTime(vol, t0 + dur*0.62);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  if(c.chop){
    var chop = ac.createOscillator(), cg = ac.createGain();
    chop.type = 'square'; chop.frequency.value = c.chop * base; cg.gain.value = 0.42;
    var chopDepth = ac.createGain(); chopDepth.gain.value = 0.58;
    chop.connect(cg); cg.connect(chopDepth.gain);
    // 让 g.gain 被颤音调制：用一个中间 gain
    var g2 = ac.createGain(); g2.gain.value = 1;
    chopDepth.connect(g2.gain);
    g.disconnect();
    g.connect(g2);
    g = g2;
  }

  var mix = ac.createGain(); mix.gain.value = c.mix;
  osc.connect(lp); osc2.connect(mix); mix.connect(lp);
  lp.connect(bp); bp.connect(g);
  g.connect(ac.destination);

  var conv = ac.createConvolver(); conv.buffer = getIR(SK.voice.ir[0], SK.voice.ir[1]);
  var wet = ac.createGain(); wet.gain.value = Math.min(.35, SK.voice.wet + .05);
  g.connect(conv); conv.connect(wet); wet.connect(ac.destination);

  osc.start(t0); osc2.start(t0); lfo.start(t0); if(c.chop) chop.start(t0);
  var end = t0 + dur + 0.05;
  osc.stop(end); osc2.stop(end); lfo.stop(end); if(c.chop) chop.stop(end);
}

/* ---- 呼噜 / 低鸣 ---- */
function purr(dur){
  if(!sfxOn) return;
  ensureAudio(); if(!ac) return;
  dur = dur || 1.7;
  var t0 = ac.currentTime + 0.01;
  var len = Math.floor(ac.sampleRate * dur);
  var buf = ac.createBuffer(1, len, ac.sampleRate);
  var d = buf.getChannelData(0);
  var p = SK.purr;
  for(var i=0;i<len;i++){
    var t = i/ac.sampleRate;
    var mod = 0.5 + 0.5*Math.sin(2*Math.PI*p.mod*t);
    var fade = Math.min(1, t/0.12) * Math.min(1, (dur-t)/0.25);
    d[i] = (Math.random()*2-1) * mod * fade;
  }
  var src = ac.createBufferSource(); src.buffer = buf;
  var lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = p.lp; lp.Q.value = 2;
  var g = ac.createGain(); g.gain.value = .34;
  src.connect(lp); lp.connect(g); g.connect(ac.destination);
  src.start(t0);
}

function blip(f1, f2, dur, type, vol){
  if(!sfxOn) return;
  ensureAudio(); if(!ac) return;
  var t0 = ac.currentTime + 0.01;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f1, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,f2), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}

function noiseBurst(dur, fCenter, Q, vol, sweepTo){
  if(!sfxOn) return;
  ensureAudio(); if(!ac) return;
  var t0 = ac.currentTime + 0.01;
  var len = Math.floor(ac.sampleRate * dur);
  var buf = ac.createBuffer(1, len, ac.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<len;i++){
    var t = i/ac.sampleRate;
    d[i] = (Math.random()*2-1) * Math.pow(1 - t/dur, 1.6);
  }
  var src = ac.createBufferSource(); src.buffer = buf;
  var bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value = Q || 1.2;
  bp.frequency.setValueAtTime(fCenter, t0);
  if(sweepTo) bp.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
  var g = ac.createGain(); g.gain.value = vol || 0.2;
  src.connect(bp); bp.connect(g); g.connect(ac.destination);
  src.start(t0);
}

  var nx = (e.clientX - r.left)/r.width;
  var ny = (e.clientY - r.top)/r.height;
  if(nx < 0 || nx > 1 || ny < 0 || ny > 1) return;
  if(ensureAudio() === null) return;
  var best = null, bd = 9e9;
  (SK.spots || []).forEach(function(sp){
    var d = Math.sqrt((nx-sp.x)*(nx-sp.x) + (ny-sp.y)*(ny-sp.y));
    if(d < sp.r && d < bd){ bd = d; best = sp.k; }
  });
  if(!best) return;
  if(best === 'tail') grabTail();
  else if(best === 'belly') pokeBelly();
  else petHead();
});

  var t0 = performance.now();
  function step(now){
    var p = Math.min(1, (now - t0)/dur);
    var e = p<0.5 ? 2*p*p : -1+(4-2*p)*p;

      (from.x + (to.x-from.x)*e).toFixed(1) + ',' + (from.y + (to.y-from.y)*e).toFixed(1) + ')');

    else if(onDone) onDone();
  }
  requestAnimationFrame(step);
}

function speakBuffer(buffer){
  ensureAudio();
  if(!ac || !buffer) return Promise.resolve();
  var v = SK.voice;

  return new Promise(function(resolve){
    var src = ac.createBufferSource();
    src.buffer = buffer;
    src.playbackRate.value = v.rate;

    var node = src;
    var auto = [];

    function chain(n){
      try{ node.connect(n); }catch(e){}
      node = n; return n;
    }

    if(v.hp){
      var hp = ac.createBiquadFilter();
      hp.type='highpass'; hp.frequency.value = v.hp; hp.Q.value = .7;
      chain(hp);
    }
    if(v.lp){
      var lpf = ac.createBiquadFilter();
      lpf.type='lowpass'; lpf.frequency.value = v.lp; lpf.Q.value = v.lpQ || .9;
      chain(lpf);
    }
    (v.peaks||[]).forEach(function(p){
      var f = ac.createBiquadFilter();
      f.type='peaking'; f.frequency.value = p[0]; f.Q.value = p[1]; f.gain.value = p[2];
      chain(f);
    });

    if(v.drive > 0){
      var sh = ac.createWaveShaper();
      var n = 1024, curve = new Float32Array(n);
      for(var i=0;i<n;i++){
        var x = i*2/n - 1;
        curve[i] = Math.tanh(x*v.drive) * .92;
      }
      sh.curve = curve;
      chain(sh);
    }

    // 电味环形调制
    if(v.ring){
      var dry = ac.createGain(); dry.gain.value = 1 - v.ringMix;
      var rm = ac.createGain(); rm.gain.value = 0;
      var ro = ac.createOscillator(); ro.type='sine'; ro.frequency.value = v.ring;
      ro.connect(rm.gain);
      var wetRm = ac.createGain(); wetRm.gain.value = v.ringMix;
      var merge = ac.createGain();
      node.connect(dry); node.connect(rm); rm.connect(wetRm);
      dry.connect(merge); wetRm.connect(merge);
      ro.start(); auto.push(ro);
      node = merge;
    }

    // 幽灵合唱
    if(v.chorus){
      var dly = ac.createDelay(0.06); dly.delayTime.value = v.chorus[0];
      var dlfo = ac.createOscillator(); dlfo.frequency.value = v.chorus[1];
      var dg = ac.createGain(); dg.gain.value = v.chorus[2];
      dlfo.connect(dg); dg.connect(dly.delayTime); dlfo.start(); auto.push(dlfo);
      var dmix = ac.createGain(); dmix.gain.value = v.chorus[3];
      var merge2 = ac.createGain();
      node.connect(merge2); node.connect(dly); dly.connect(dmix); dmix.connect(merge2);
      node = merge2;
    }

    var g = ac.createGain(); g.gain.value = v.gain; chain(g);

    if(v.vib){
      var lfo = ac.createOscillator(); lfo.type='sine'; lfo.frequency.value = v.vib;
      var lg = ac.createGain(); lg.gain.value = v.vibAmt;
      lfo.connect(lg); lg.connect(src.playbackRate); lfo.start(); auto.push(lfo);
    }

    analyser = ac.createAnalyser();
    analyser.fftSize = 512;
    g.connect(analyser); analyser.connect(ac.destination);

    var conv = ac.createConvolver(); conv.buffer = getIR(v.ir[0], v.ir[1]);
    var wet = ac.createGain(); wet.gain.value = v.wet;
    g.connect(conv); conv.connect(wet); wet.connect(ac.destination);

    setSpeaking(true);
    src.start(0);

    var tds = new Uint8Array(analyser.frequencyBinCount);
    cancelAnimationFrame(speakRaf);
    (function loop(){
      analyser.getByteTimeDomainData(tds);
      var pk = 0;
      for(var k=0;k<tds.length;k++){
        var val = Math.abs(tds[k]-128);
        if(val > pk) pk = val;
      }
      var lv = Math.min(1, pk/56);
      setMouth(lv);
      if(sceneOn) sceneIn.style.setProperty('--lv', lv.toFixed(3));
      speakRaf = requestAnimationFrame(loop);
    })();

    var done = false;
    function finish(){
      if(done) return; done = true;
      cancelAnimationFrame(speakRaf);
      setSpeaking(false);
      if(E.pupilL){ E.pupilL.style.transform = ''; E.pupilR.style.transform = ''; }
      auto.forEach(function(o){ try{ o.stop(); }catch(e){} });
      resolve();
    }
    src.onended = finish;
    setTimeout(function(){
      if(petEl.classList.contains('speaking')) finish();
    }, (buffer.duration / v.rate) * 1000 + 600);
  });
}

/* ============================================================
   采集引擎：常听 / 手动，共用一套 VAD
============================================================ */
var EN = {
  mode:'off',           // off | manual | always
  state:'idle',         // idle | rec | play | cool
  stream:null, srcNode:null, proc:null, sink:null,
  chunks:[], len:0,
  above:0, below:0,
  recAt:0,
  floor:0.012,
  TH_ON:0.030, TH_OFF:0.018,
  boostUntil:0,
  calFrames:0, calSum:0
};
var SAMPLE_RATE = 0;

function closeMic(){
  if(EN.proc){ try{ EN.proc.disconnect(); }catch(e){} EN.proc.onaudioprocess = null; EN.proc = null; }
  if(EN.srcNode){ try{ EN.srcNode.disconnect(); }catch(e){} EN.srcNode = null; }
  if(EN.sink){ try{ EN.sink.disconnect(); }catch(e){} EN.sink = null; }
  if(EN.stream){
    EN.stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} });
    EN.stream = null;
  }
}

function openMic(){
  if(EN.stream) return Promise.resolve();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return Promise.reject(new Error('NoGetUserMedia'));
  }
  var always = (EN.mode === 'always');
  return navigator.mediaDevices.getUserMedia({
    audio:{
      echoCancellation: always,
      noiseSuppression: always,
      autoGainControl: false,
      channelCount: 1
    }
  }).then(function(s){
    EN.stream = s;
    ensureAudio();
    if(!ac) throw new Error('NoAudioContext');
    SAMPLE_RATE = ac.sampleRate;
    EN.srcNode = ac.createMediaStreamSource(s);
    var bufSize = 2048;
    EN.proc = ac.createScriptProcessor(bufSize, 1, 1);
    EN.sink = ac.createGain(); EN.sink.gain.value = 0;
    EN.srcNode.connect(EN.proc);
    EN.proc.connect(EN.sink);
    EN.sink.connect(ac.destination);
    EN.proc.onaudioprocess = function(e){
      var inp = e.inputBuffer.getChannelData(0);
      var sum = 0;
      for(var i=0;i<inp.length;i++) sum += inp[i]*inp[i];
      frame(Math.sqrt(sum/inp.length), inp);
    };
    EN.chunks = []; EN.len = 0; EN.floor = 0.012; EN.calFrames = 0; EN.calSum = 0;
    EN.state = 'idle'; EN.above = 0; EN.below = 0;
  });
}

var meterEl = $('meter');
var meterMark = 0;

function frame(rms, data){
  if(meterEl){
    var now = performance.now();
    if(now - meterMark > 55){
      meterMark = now;
      meterEl.style.width = Math.min(100, rms*460).toFixed(1) + '%';
    }
  }

  // 前 ~0.7 秒做环境噪声校准
  if(EN.calFrames < 18){
    EN.calFrames++;
    EN.calSum += rms;
    if(EN.calFrames === 18){
      EN.floor = Math.max(0.004, EN.calSum/18);
      EN.TH_ON  = Math.max(0.020, EN.floor*3.4);
      EN.TH_OFF = EN.TH_ON * 0.58;
    }
    return;
  }

  var boosted = performance.now() < EN.boostUntil;
  var k = boosted ? 1.9 : 1;
  var on  = EN.TH_ON  * k;
  var off = EN.TH_OFF * k;

  if(EN.state === 'idle'){
    if(EN.mode === 'always'){
      if(rms > on){
        EN.above++;
        if(EN.above >= 2) { EN.above = 0; beginRec(); }
      } else EN.above = 0;
    }
    return;
  }

  if(EN.state === 'rec'){
    if(EN.len < SAMPLE_RATE*22){
      EN.chunks.push(new Float32Array(data));
      EN.len += data.length;
    }
    if(rms > off) EN.below = 0;
    else EN.below++;

    var durMs = performance.now() - EN.recAt;
    var minMs = (EN.mode === 'manual') ? 1000 : 260;
    var quietNeeded = 12;
    if(durMs > minMs && EN.below >= quietNeeded) endRec();
    else if(durMs > (EN.mode === 'manual' ? 20000 : 12000)) endRec();
  }
}

function beginRec(){
  if(EN.state !== 'idle') return;
  EN.state = 'rec';
  EN.chunks = []; EN.len = 0; EN.below = 0; EN.recAt = performance.now();
  $('micBtn').classList.add('rec');
  if(EN.mode === 'manual'){ setHint('正在听…说完自动停'); }
}

function endRec(silent){
  if(EN.state !== 'rec') return;
  EN.state = 'cool';
  $('micBtn').classList.remove('rec');
  setHint('');

  var n = EN.len;
  var chunks = EN.chunks;
  EN.chunks = []; EN.len = 0;

  if(silent){ EN.state = 'idle'; return; }
  if(n < SAMPLE_RATE*0.20 || !ac){ EN.state = 'idle'; return; }

  var buf = ac.createBuffer(1, n, SAMPLE_RATE);
  var ch = buf.getChannelData(0);
  var off = 0;
  for(var i=0;i<chunks.length;i++){ ch.set(chunks[i], off); off += chunks[i].length; }

  var f = Math.min(Math.floor(SAMPLE_RATE*0.012), Math.floor(n/4));
  for(var j=0;j<f;j++){
    var k = j/f;
    ch[j] *= k;
    ch[n-1-j] *= k;
  }

  EN.state = 'play';
  speakBuffer(buf).then(function(){
    EN.state = 'cool';
    EN.boostUntil = performance.now() + 1700;
    setTimeout(function(){
      if(EN.state === 'cool') EN.state = 'idle';
      EN.above = 0; EN.below = 0;
    }, 700);
  });
}

var hintEl = $('hint'), hintT = 0;
function setHint(txt){
  if(!txt){ hintEl.classList.remove('show'); return; }
  hintEl.textContent = txt;
  hintEl.classList.add('show');
  clearTimeout(hintT);
  hintT = setTimeout(function(){ hintEl.classList.remove('show'); }, 2600);
}

/* ---- 模式切换 ---- */
var alwaysBtn = $('alwaysBtn');
var micBtn = $('micBtn');

function enterAlways(){
  EN.mode = 'always';
  closeMic();
  EN.mode = 'always';
  return openMic().then(function(){
    alwaysBtn.classList.add('on');
    micBtn.classList.add('live');
    setHint('已开常听：直接说话，' + SK.name + '会跟着学');
    toast('<b>常听模式已开</b><br>说一句，' + SK.name + '就跟着说一句。<br>耳机效果最好（避免它听见自己）。');
  });
}
function exitAll(){
  closeMic();
  EN.mode = 'off'; EN.state = 'idle';
  alwaysBtn.classList.remove('on');
  micBtn.classList.remove('live','rec');
  setHint('');
}
function toggleAlways(){
  if(EN.mode === 'always') exitAll();
  else enterAlways().catch(micErr);
}
alwaysBtn.addEventListener('click', function(){ ensureAudio(); toggleAlways(); });

function micErr(err){
  var m = (err && (err.name || err.message)) || '';
  if(m === 'NotAllowedError' || m === 'SecurityError'){
    toast('麦克风被拒绝了。<br>去「设置 → 应用 → 说话宠物 → 权限」里打开< b>麦克风</b>，然后重开一次。'.replace('< b>','<b>'));
  }else if(m === 'NotFoundError'){
    toast('没找到麦克风设备');
  }else if(m === 'NoGetUserMedia' || m === 'NoAudioContext'){
    toast('这个环境不支持录音');
  }else{
    toast('打不开麦克风：' + m);
  }
}

micBtn.addEventListener('click', function(){
  ensureAudio();
  if(EN.state === 'rec'){ endRec(); return; }
  if(EN.state === 'play' || EN.state === 'cool') return;
  if(EN.mode === 'always'){
    // 常听下点一下＝手动插一句
    beginRec();
    return;
  }
  var wasOff = (EN.mode === 'off');
  EN.mode = 'manual';
  (wasOff ? closeMic() : Promise.resolve()).then(function(){
    EN.mode = 'manual';
    return openMic();
  }).then(function(){
    EN.state = 'idle'; EN.above = 0;
    beginRec();
  }).catch(micErr);
});

});

function hashSkin(){
  var h = (location.hash || '').replace('#','');
  return SKINS[h] ? h : '';
}
loadSkin(hashSkin() || 'tom', false);
window.addEventListener('hashchange', function(){
  var h = hashSkin();
  if(h && h !== cur) loadSkin(h);
});
setTimeout(function(){
  if(EN.mode === 'off'){
    setHint('点麦克风说一句，或者点右上角开启常听');
  }
}, 1100);

/* 首次触摸解锁音频上下文 */
function unlock(){
  ensureAudio();
  if(ac && ac.state === 'running') document.removeEventListener('pointerdown', unlock);
}
document.addEventListener('pointerdown', unlock);

window.addEventListener('keydown', function(e){
  if(e.code === 'Space' && !e.repeat && document.activeElement === document.body){
    e.preventDefault();
    micBtn.click();
  }
});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

/* 给安卓壳调用 / 自检用 */
window.TP = {
  setAlways: function(on){ ensureAudio(); if(on) enterAlways().catch(micErr); else exitAll(); },
  isNight: function(){ return nightOn; },
  skin: function(id){ if(SKINS[id]) loadSkin(id); },
  micErr: micErr,
  status: function(){
    return {
      skin: cur, mode: EN.mode, state: EN.state, micOpen: !!EN.stream,
      thOn: +EN.TH_ON.toFixed(4), thOff: +EN.TH_OFF.toFixed(4),
      floor: +EN.floor.toFixed(4), pcm: EN.len, audio: ac ? ac.state : 'none'
    };
  },
  force: function(){ if(EN.state === 'idle') beginRec(); },
  stop: function(){ endRec(); }
};
window.__TP_READY__ = true;

})();
